# Default values for sysml-jupyter Helm chart
# This is a YAML-formatted file for Kubernetes/OpenShift values

replicaCount: 1

image:
  registry: docker.io
  repository: mbsemashup/sysmlv2-jupyter
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  # runAsNonRoot: true
  # runAsUser: 1010
  runAsGroup: 100
  # fsGroup: 0
  # seccompProfile:
  #   type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8888
  targetPort: 8888
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jupyter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Persistent storage for notebooks and data
persistence:
  enabled: false
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /home/jovyan/work

# JupyterLab environment variables
env:
  - name: JUPYTER_ENABLE_LAB
    value: "yes"

# Command to run
command:
  - "start-notebook.sh"

# Args for the command
args:
  - "--ip=0.0.0.0"
  - "--port=8888"
  - "--no-browser"
  - "--allow-root"

# Liveness probe
livenessProbe:
  httpGet:
    path: /lab
    port: 8888
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /lab
    port: 8888
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /home/jovyan/work

# Enable OpenShift Route
route:
  enabled: true
  host: ""  # Change to your OpenShift domain
  tls:
    enabled: true
    termination: edge

# Health checks
livenessProbe:
  httpGet:
    path: /lab
    port: 8888
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /lab
    port: 8888
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 2

# Optional: Node affinity for specific nodes
nodeSelector: {}
  # node.kubernetes.io/instance-type: "standard"

# Optional: Pod tolerations for tainted nodes
tolerations: []
  # - key: "dedicated"
  #   operator: "Equal"
  #   value: "jupyter"
  #   effect: "NoSchedule"

# Optional: Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
